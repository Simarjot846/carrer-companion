services:
  - type: web
    name: career-companion
    runtime: python
    plan: free
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-10000}
    envVars:
      - key: DATABASE_URL
        sync: false          # Set manually in Render dashboard
      - key: GOOGLE_API_KEY
        sync: false          # Set manually in Render dashboard
      - key: PYTHON_VERSION
        value: "3.10.14"
      - key: AUTO_SEED_JOBS
        value: "true"
      - key: NODE_VERSION
        value: "20"          # Needed to build the React frontend
