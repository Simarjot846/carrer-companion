services:
  - type: web
    name: career-companion-api
    runtime: python
    plan: free
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: career-companion-db-v2
          property: connectionString
      - key: GOOGLE_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.10.14
      - key: AUTO_SEED_JOBS
        value: "true"

databases:
  - name: career-companion-db-v2
    databaseName: career_companion
    user: career_user
    plan: free
